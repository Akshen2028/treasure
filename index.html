<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the installed app use the full screen around the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wedonomics</title>
    <meta name="description" content="Wedonomics — an elegant wedding budget planner." />
    <meta name="theme-color" content="#fbf8f3" />
    <meta name="color-scheme" content="light" />

    <!-- Installable app (Android, desktop) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Add to Home Screen (iOS): full screen, title and icon -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wedonomics" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
