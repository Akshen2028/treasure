name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  changes:
    name: Detect data changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      data: ${{ steps.filter.outputs.data }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            data:
              - 'supabase/**'
              - 'tests/integration/**'
              - 'src/data/**'
              - 'scripts/**'
              - 'vitest.integration.config.ts'

  integration:
    name: Integration tests (remote DB)
    needs: changes
    # PRs that touch data, or a manual run. Forks never get the secrets.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.outputs.data == 'true' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run at a time: the tests share the production project.
    concurrency:
      group: integration-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
